name: Create Well failure alert

on:
  workflow_run:
    workflows:
      - Notion content to website
      - NodeJS build
    types: [completed]
  deployment_status:

permissions:
  contents: read
  issues: write

jobs:
  alert:
    name: Open or update failure alert
    if: >-
      (github.event_name == 'workflow_run' &&
        (github.event.workflow_run.conclusion == 'failure' ||
         github.event.workflow_run.conclusion == 'timed_out' ||
         github.event.workflow_run.conclusion == 'cancelled' ||
         github.event.workflow_run.conclusion == 'action_required')) ||
      (github.event_name == 'deployment_status' &&
        (github.event.deployment_status.state == 'failure' ||
         github.event.deployment_status.state == 'error'))
    runs-on: ubuntu-latest
    steps:
      - name: Create or update repository alert
        uses: actions/github-script@v7
        with:
          script: |
            const eventName = context.eventName;
            const workflowRun = context.payload.workflow_run;
            const deploymentStatus = context.payload.deployment_status;
            const isWorkflowFailure = eventName === 'workflow_run';
            const source = isWorkflowFailure
              ? workflowRun.name
              : `Deployment ${context.payload.deployment?.environment || 'unknown environment'}`;
            const state = isWorkflowFailure ? workflowRun.conclusion : deploymentStatus.state;
            const detailUrl = isWorkflowFailure
              ? workflowRun.html_url
              : (deploymentStatus.target_url || context.payload.deployment?.url || '');
            const issueTitle = `[Automation alert] ${source} failed`;
            const detailLine = detailUrl ? `[Open the failed run or deployment](${detailUrl})` : 'No run or deployment URL was provided.';
            const body = [
              '<!-- createwell-failure-alert -->',
              '## Automated failure alert',
              '',
              `**Source:** ${source}`,
              `**Result:** ${state}`,
              `**Detected:** ${new Date().toISOString()}`,
              '',
              detailLine,
              '',
              'This issue was created automatically. Resolve the underlying problem, verify a successful follow-up run, then close this alert.',
            ].join('\n');
            const search = await github.rest.search.issuesAndPullRequests({
              q: `repo:${context.repo.owner}/${context.repo.repo} is:issue is:open in:title "${issueTitle}"`,
              per_page: 10,
            });
            const existing = search.data.items.find((item) => item.title === issueTitle);

            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `A further failure was detected.\n\n${body}`,
              });
              core.notice(`Updated existing alert issue #${existing.number}.`);
            } else {
              const issue = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: issueTitle,
                body,
              });
              core.notice(`Created alert issue #${issue.data.number}.`);
            }
